name: Daily contribution heartbeat

on:
  schedule:
    # GitHub cron uses UTC. 15:05 UTC is 00:05 in Asia/Seoul.
    - cron: "5 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-contribution-heartbeat
  cancel-in-progress: false

jobs:
  update-heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update the daily heartbeat
        env:
          TZ: Asia/Seoul
        run: |
          seoul_date="$(date +%F)"
          mkdir -p .github/activity
          printf '{\n  "date": "%s",\n  "timezone": "Asia/Seoul",\n  "purpose": "Daily repository maintenance heartbeat"\n}\n' \
            "$seoul_date" > .github/activity/latest.json

      - name: Commit and push when the date changed
        env:
          TZ: Asia/Seoul
        run: |
          seoul_date="$(date +%F)"
          git config user.name "Junebooky"
          git config user.email "140563324+Junebooky@users.noreply.github.com"
          git add .github/activity/latest.json

          if git diff --cached --quiet; then
            echo "Heartbeat already exists for ${seoul_date}."
            exit 0
          fi

          git commit -m "chore: record daily heartbeat ${seoul_date}"
          git push origin HEAD:main
